<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Six Hours Till Dawn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="title" class="scr on">
  <h1>Six Hours Till Dawn</h1>
  <p>One night, six real hours. Watch the doors, the bed, and the closet.</p>
  <button id="go">Click to Start</button>
  <p class="keys">F flashlight &nbsp; E door (toggle) &nbsp; Space center &nbsp; A left &nbsp; D right &nbsp; S bed &nbsp; W closet &nbsp; ` debug</p>
</section>
<section id="game" class="scr">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="hud"><b id="clock"></b><span id="view"></span><span id="st"></span></div>
  <pre id="dbg"></pre>
</section>
<section id="over" class="scr">
  <h2>Game Over</h2>
  <p id="why"></p>
  <button class="again">Try again</button>
</section>
<section id="win" class="scr">
  <h2>6 AM</h2>
  <p>You made it through the night.</p>
  <button class="again">Play again</button>
</section>
<script src="game.js"></script>
</body>
</html>
